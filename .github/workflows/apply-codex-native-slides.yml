name: Apply Codex-native Slides Fallback

on:
  push:
    branches:
      - codex-v1
    paths:
      - 'tools/codex-v1/patch-slides-native-fallback.mjs'
      - '.github/workflows/apply-codex-native-slides.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codex-v1
        uses: actions/checkout@v4
        with:
          ref: codex-v1
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Apply Slides fallback patch
        run: node tools/codex-v1/patch-slides-native-fallback.mjs .

      - name: Verify patch diff
        run: git diff --check

      - name: Commit flattened source change
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/slides/src/renderer/ai/slides-skill.ts
          git commit -m 'fix(slides): fall back to Codex-native page rendering'
          git push origin codex-v1
